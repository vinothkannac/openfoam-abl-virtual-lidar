name: tests
on: [push, pull_request]
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy pandas matplotlib scikit-learn xarray netCDF4 pytest && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e . --no-deps
      - run: pytest -q tests
